[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcc-liars-dice"
version = "0.1.0"
description = "Synthetic Liars Dice laboratory for cross-domain PCC validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pcc-liars-dice = "pcc_liars_dice.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
